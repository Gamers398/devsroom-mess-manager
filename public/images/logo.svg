<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" width="100%" height="100%">
  <defs>
    <style>
      .navy { fill: #0B2038; }
      .navy-stroke { stroke: #0B2038; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gold { fill: #C49247; }
      .gold-stroke { stroke: #C49247; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .white { fill: #FFFFFF; }
      .brand-title {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 1.5px;
        fill: #0B2038;
      }
      .brand-subtitle {
        font-family: 'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #C49247;
      }
    </style>
  </defs>

  <!-- Left Emblem (Scales to full 56px height) -->
  <g transform="translate(4, 4) scale(0.18)">
    <circle cx="155" cy="155" r="148" class="navy-stroke" stroke-width="8" fill="#FFFFFF" />
    <circle cx="155" cy="155" r="138" class="gold-stroke" stroke-width="3.5" />

    <!-- Steam -->
    <path class="gold" d="M 140 68 C 136 60, 145 54, 142 44 C 148 52, 140 58, 143 68 Z" />
    <path class="gold" d="M 155 63 C 148 50, 160 42, 155 28 C 164 40, 153 48, 159 63 Z" />
    <path class="gold" d="M 170 68 C 174 60, 165 54, 168 44 C 162 52, 170 58, 167 68 Z" />

    <!-- Cloche -->
    <ellipse cx="155" cy="76" rx="8" ry="6" class="navy" />
    <path class="navy" d="M 98 132 A 57 57 0 0 1 212 132 Z" />
    <path d="M 110 126 A 44 44 0 0 1 135 94" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <rect x="90" y="132" width="130" height="6" rx="3" class="navy" />
    <path d="M 30 160 Q 155 132 280 160 Q 155 140 30 160 Z" class="navy" />

    <!-- Fork & Spoon -->
    <g transform="translate(62, 65)">
      <rect x="14" y="34" width="4" height="48" class="navy" rx="2" />
      <path class="navy" d="M 9 10 L 9 25 Q 9 34 16 34 Q 23 34 23 25 L 23 10 L 21 10 L 21 23 Q 21 27 16 27 Q 11 27 11 23 L 11 10 Z" />
      <rect x="14" y="10" width="4" height="14" class="navy" />
    </g>
    <g transform="translate(215, 65)">
      <ellipse cx="18" cy="23" rx="13" ry="18" class="navy" />
      <rect x="16" y="38" width="4" height="44" class="navy" rx="2" />
    </g>

    <!-- 4 Sub-Icons -->
    <line x1="95" y1="178" x2="95" y2="218" class="gold-stroke" stroke-width="2.5" />
    <line x1="155" y1="178" x2="155" y2="218" class="gold-stroke" stroke-width="2.5" />
    <line x1="215" y1="178" x2="215" y2="218" class="gold-stroke" stroke-width="2.5" />

    <!-- Bowl -->
    <g transform="translate(48, 182)">
      <path class="gold" d="M 4 14 Q 18 14 32 14 L 27 28 Q 18 31 9 28 Z" />
      <rect x="11" y="28" width="14" height="3" class="gold" rx="1" />
      <circle cx="18" cy="9" r="3" class="gold" />
      <circle cx="12" cy="11.5" r="2.5" class="gold" />
      <circle cx="24" cy="11.5" r="2.5" class="gold" />
    </g>
    <!-- Basket -->
    <g transform="translate(108, 180)">
      <path d="M 9 13 L 18 3 L 27 13" class="gold-stroke" stroke-width="2.2" />
      <rect x="4" y="13" width="28" height="4" class="gold" rx="1.5" />
      <path class="gold" d="M 6 17 L 10 33 L 26 33 L 30 17 Z" />
      <rect x="12" y="21" width="2.2" height="8" class="white" rx="0.8" />
      <rect x="17" y="21" width="2.2" height="8" class="white" rx="0.8" />
      <rect x="22" y="21" width="2.2" height="8" class="white" rx="0.8" />
    </g>
    <!-- Bill Memo -->
    <g transform="translate(172, 178)">
      <path class="gold-stroke" stroke-width="2.5" d="M 5 2 L 29 2 L 29 35 L 25 32 L 21 35 L 17 32 L 13 35 L 9 32 L 5 35 Z" />
      <text x="17" y="26" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="14" font-weight="bold" class="gold" text-anchor="middle">৳</text>
    </g>
    <!-- Cards -->
    <g transform="translate(230, 182)">
      <rect x="1" y="2" width="26" height="16" rx="2.5" class="gold" opacity="0.6" />
      <rect x="7" y="9" width="28" height="19" rx="2.5" class="gold" />
      <rect x="7" y="14" width="28" height="3.5" class="white" />
      <text x="17" y="25" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="7.5" font-weight="bold" class="white" text-anchor="middle">৳</text>
    </g>

    <!-- House -->
    <path class="navy" d="M 85 258 L 155 210 L 225 258 L 225 292 C 225 302 195 310 155 310 C 115 310 85 302 85 292 Z" />
    <path d="M 104 260 L 155 225 L 206 260" class="gold-stroke" stroke-width="6.5" />
    <rect x="142" y="258" width="10" height="9" class="white" rx="1" />
    <rect x="158" y="258" width="10" height="9" class="white" rx="1" />
    <rect x="142" y="271" width="10" height="9" class="white" rx="1" />
    <rect x="158" y="271" width="10" height="9" class="white" rx="1" />
  </g>

  <!-- Typography Block -->
  <g transform="translate(72, 12)">
    <text x="0" y="26" class="brand-title">OFFICERS<tspan fill="#C49247">'</tspan> MESS</text>
    <text x="2" y="44" class="brand-subtitle">MANAGEMENT PORTAL</text>
  </g>
</svg>
